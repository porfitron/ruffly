<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F59E0B" />
    <meta
      name="description"
      content="About Ruffly — precision dog nutrition for everyday feeding."
    />
    <title>About Ruffly</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --cream: #fbf9f5;
        --gold: #f59e0b;
        --ink: #1e293b;
        --muted: #64748b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, #fde68a55, transparent),
          var(--cream);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: max(2rem, env(safe-area-inset-top)) 1.25rem 3rem;
      }

      .brand {
        margin: 0;
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--gold);
      }

      h1 {
        margin: 1.5rem 0 0.75rem;
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      p {
        margin: 0 0 1rem;
        font-size: 1.05rem;
        line-height: 1.65;
        color: var(--muted);
      }

      a.app {
        display: inline-flex;
        margin-top: 0.5rem;
        color: var(--gold);
        font-weight: 700;
        text-decoration: none;
      }

      a.app:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Ruffly</p>
      <h1>Precision nutrition for your pup</h1>
      <p>
        Ruffly helps you dial in daily calories, keep a pantry of real foods,
        balance the bowl, and pack a trip care sheet — all on your phone.
      </p>
      <p>
        Built for dog people who care about the numbers behind the bowl.
      </p>
      <a class="app" href="../">Back to the app</a>
    </main>
  </body>
</html>
